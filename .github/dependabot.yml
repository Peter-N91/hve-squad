version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      # Dependabot cannot run `apm run change`, and PR Validation rejects a pull
      # request that carries no fragment. Action bumps are not consumer-visible
      # for a package of markdown assets, so they take the skip label instead.
      - "skip-changelog"
    groups:
      github-actions:
        patterns:
          - "*"
