name: Release Prep

# Turns the fragments collected in .changes/unreleased/ into a reviewed release
# pull request, then dispatches release.yml once that pull request merges.
#
#   1. On `workflow_dispatch`, Invoke-ReleasePrep.ps1 resolves the new version from
#      the highest `bump` across all pending fragments, prepends the assembled
#      CHANGELOG section, writes `version:` into apm.yml, and deletes the fragments
#      it consumed.
#   2. Pushes `chore/release-prep` (or `chore/release-prep-<ref>` for a hotfix
#      branch) and opens or updates a reviewed pull request against the target
#      branch — never pushing directly to `main`.
#   3. When that release pull request merges (`push` on `main` or `hotfix/**`
#      bumping `version:` in `apm.yml` and updating `CHANGELOG.md` for an untagged
#      version), `dispatch-release` triggers `release.yml`, retires any rolling
#      `-pre` pre-release on `main`, and refreshes published documentation.
#
# Required configuration
#   Environment `automation-governance` (`deployment: false`):
#     Preferred (`microsoft/*` org governance): configure variable
#       `AUTOMATION_APP_CLIENT_ID` and secret `AUTOMATION_APP_PRIVATE_KEY` for an
#       org-owned GitHub App with Contents, Pull requests, and Actions read/write.
#     Transitional fallback (pre-transfer): when `AUTOMATION_APP_CLIENT_ID` is
#       unset, falls back to secret `SYNC_DEPS_TOKEN` (fine-grained PAT with
#       Contents, Pull requests, and Actions read/write on this repository).

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual dispatch (write access required); inputs are passed through env and never interpolated into the pwsh script body.
    inputs:
      bump:
        description: 'Release level. "fragments" honours what the pending fragments requested; pick minor only when this batch is a genuinely new idea.'
        required: false
        default: fragments
        type: choice
        options:
          - fragments
          - patch
          - minor
          - major
      version:
        description: 'Optional: exact version to release (e.g. 0.12.0). Overrides the bump choice.'
        required: false
        type: string
      dry_run:
        description: 'Print the assembled section and resolved version without committing'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch to release from. Leave as main unless cutting a hotfix off a release tag.'
        required: false
        default: main
        type: string
  push:
    branches:
      - main
      - 'hotfix/**'
    paths:
      - 'CHANGELOG.md'
      - 'apm.yml'

concurrency:
  group: release-prep-${{ github.event_name }}-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Assemble changelog and propose release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: automation-governance
      deployment: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate target branch
        id: target
        env:
          RAW_REF: ${{ inputs.ref || 'main' }}
        run: |
          REF="$RAW_REF"
          if [[ ! "$REF" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ || "$REF" == *..* || "$REF" == *//* || "$REF" == */ || "$REF" == *. || "$REF" == chore/release-prep* ]]; then
            echo "::error::Invalid target branch '$REF'."
            exit 1
          fi
          if [[ "$REF" == "main" ]]; then
            PR_BRANCH="chore/release-prep"
          else
            SAFE_REF=$(printf '%s' "$REF" | tr '/.' '--')
            PR_BRANCH="chore/release-prep-${SAFE_REF}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        if: vars.AUTOMATION_APP_CLIENT_ID != '' && !inputs.dry_run
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify automation credential
        if: ${{ !inputs.dry_run }}
        env:
          AUTOMATION_TOKEN: ${{ steps.app_token.outputs.token || secrets.SYNC_DEPS_TOKEN }}
        run: |
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::No automation token available. Configure AUTOMATION_APP_CLIENT_ID + AUTOMATION_APP_PRIVATE_KEY in the 'automation-governance' environment (or transitional secret SYNC_DEPS_TOKEN)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.target.outputs.ref }}

      - name: Assemble release
        id: prep
        shell: pwsh
        # Inputs arrive via env, never interpolated into the script body, so a
        # crafted `version` value cannot break out into a command.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Hashtable, not array: array splatting binds positionally, so '-GitHubOutput'
          # would land in the first positional parameter instead of setting the switch.
          $prepArgs = @{ GitHubOutput = $true }
          if ($env:INPUT_VERSION) { $prepArgs['Version'] = $env:INPUT_VERSION }
          elseif ($env:INPUT_BUMP -and $env:INPUT_BUMP -ne 'fragments') { $prepArgs['Bump'] = $env:INPUT_BUMP }
          if ($env:INPUT_DRY_RUN -eq 'true') { $prepArgs['DryRun'] = $true }
          ./scripts/Invoke-ReleasePrep.ps1 @prepArgs

      - name: Propose release pull request
        if: steps.prep.outputs.has_changes == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.SYNC_DEPS_TOKEN }}
          REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.prep.outputs.version }}
          REF: ${{ steps.target.outputs.ref }}
          PR_BRANCH: ${{ steps.target.outputs.pr_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git checkout -B "$PR_BRANCH"
          git add apm.yml CHANGELOG.md .changes/unreleased
          if git diff --cached --quiet; then
            echo "::notice::Nothing to commit."
            exit 0
          fi
          TITLE="chore(release): ${NEW_VERSION}"
          git commit -m "$TITLE"
          git push --force origin "refs/heads/${PR_BRANCH}"

          BODY_FILE="$RUNNER_TEMP/release-prep-pr-body.md"
          cat > "$BODY_FILE" <<EOF
          ## Summary

          Assembled release \`v${NEW_VERSION}\` targeting \`${REF}\` via **Release Prep**.

          - Updates \`CHANGELOG.md\` and \`apm.yml\` (\`version: ${NEW_VERSION}\`)
          - Clears consumed fragments from \`.changes/unreleased/\`

          Merging this pull request automatically triggers \`release.yml\` to tag \`v${NEW_VERSION}\` and publish the GitHub Release.
          EOF
          sed -i 's/^          //' "$BODY_FILE"

          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$PR_BRANCH" --base "$REF" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE"
            echo "::notice::Updated release pull request #${EXISTING_PR} for v${NEW_VERSION} (${REF})."
          else
            PR_URL=$(gh pr create --repo "$REPO" --base "$REF" --head "$PR_BRANCH" --title "$TITLE" --body-file "$BODY_FILE")
            echo "::notice::Opened release pull request for v${NEW_VERSION} (${REF}): ${PR_URL}"
          fi

  dispatch-release:
    name: Dispatch release after merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: automation-governance
      deployment: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect merged release commit
        id: detect
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only HEAD^1 HEAD | grep -qx 'CHANGELOG.md'; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_VERSION=$(git diff -U0 HEAD^1 HEAD -- apm.yml | sed -nE 's/^\+version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?)$/\1/p' | head -n1)
          if [[ -z "$NEW_VERSION" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v${NEW_VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $2}' | grep -qx "refs/tags/${TAG}"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${TAG} already exists (hotfix merge-back or prior release) — skipping release dispatch."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        if: steps.detect.outputs.should_release == 'true' && vars.AUTOMATION_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: write

      # Dispatched from main so the workflow definition is always the current one,
      # with the ref to tag passed as an input. A hotfix branch cut off an old
      # release tag carries that tag's copy of release.yml, which may predate the
      # ref input entirely.
      - name: Trigger release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.SYNC_DEPS_TOKEN || secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.detect.outputs.version }}
          REF: ${{ steps.detect.outputs.ref }}
        run: |
          gh workflow run release.yml --ref main -f ref="$REF"
          echo "::notice::Triggered release.yml for v${NEW_VERSION} on ${REF}"

      # The fragments this release consumed are what the pre-release was rendering,
      # so it now describes a release that has shipped. A hotfix released off
      # another branch consumed only that branch's fragments; main's batch is still
      # pending, so its preview must survive.
      - name: Retire the rolling pre-release
        if: steps.detect.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t found < <(
            gh release list --limit 100 --json tagName,isPrerelease \
              --jq '.[] | select(.isPrerelease) | .tagName' \
              | grep -E -- '-pre$' || true
          )
          for stale in "${found[@]}"; do
            if [[ -n "$stale" ]]; then
              echo "::notice::Retiring pre-release $stale"
              gh release delete "$stale" --yes --cleanup-tag || true
            fi
          done

      - name: Refresh published documentation
        if: always() && steps.detect.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
