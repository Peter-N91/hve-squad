name: Publish Plugin

# Manual only. Stable and preview distributions are generated into branches in
# this repository:
#   plugin          - latest manually published stable release
#   plugin-preview  - latest manually published preview
#
# Each branch is a self-contained marketplace with one hve-squad plugin. The
# plugin bundles the exact microsoft/hve-core commit pinned by the selected
# hve-squad ref and contains no MCP server configuration.
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual publication intentionally writes a generated distribution branch after validating the selected ref.
    inputs:
      channel:
        description: Distribution channel to publish
        required: true
        default: stable
        type: choice
        options:
          - stable
          - preview
      ref:
        description: 'Source ref. Blank selects the highest stable tag or rolling preview tag for the chosen channel.'
        required: false
        type: string

concurrency:
  group: publish-plugin-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.channel }} plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout hve-squad source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve source and channel identity
        id: release
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          REF="$REF_INPUT"
          if [[ -z "$REF" ]]; then
            if [[ "$CHANNEL" == "stable" ]]; then
              REF=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
              [[ -n "$REF" ]] || { echo "::error::No stable release tag exists."; exit 1; }
            else
              REF=$(git tag -l 'v*-pre' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-pre$' | sort -V | tail -n1)
              [[ -n "$REF" ]] || { echo "::error::No rolling preview tag exists."; exit 1; }
            fi
          fi

          if [[ ! "$REF" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ || "$REF" == *..* || "$REF" == *//* || "$REF" == */ || "$REF" == *. ]]; then
            echo "::error::Invalid git ref '$REF'."
            exit 1
          fi
          git rev-parse --verify "${REF}^{commit}" >/dev/null
          SOURCE_SHA=$(git rev-parse "${REF}^{commit}")
          APM=$(git show "${REF}:apm.yml")
          HVE_CORE_SHA=$(printf '%s\n' "$APM" \
            | grep -E 'microsoft/hve-core/[^#[:space:]]+#[0-9a-f]{40}' \
            | sed -E 's/.*#([0-9a-f]{40}).*/\1/' \
            | sort -u)
          if [[ $(printf '%s\n' "$HVE_CORE_SHA" | sed '/^$/d' | wc -l) -ne 1 ]]; then
            echo "::error::The selected apm.yml must pin every HVE Core dependency to one commit."
            exit 1
          fi

          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            BASE_VERSION="${REF#v}"
          else
            BASE_VERSION=$(printf '%s\n' "$APM" | sed -nE 's/^version:[[:space:]]*//p' | head -n1)
          fi
          if [[ "$CHANNEL" == "preview" ]]; then
            if [[ "$BASE_VERSION" == *-* ]]; then
              VERSION="${BASE_VERSION}.run.${GITHUB_RUN_NUMBER}"
            else
              VERSION="${BASE_VERSION}-preview.run.${GITHUB_RUN_NUMBER}"
            fi
            TARGET_BRANCH=plugin-preview
            MARKETPLACE_NAME=hve-squad-preview
          else
            VERSION="$BASE_VERSION"
            TARGET_BRANCH=plugin
            MARKETPLACE_NAME=hve-squad
          fi

          echo "source_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "hve_core_sha=$HVE_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "marketplace_name=$MARKETPLACE_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned HVE Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/hve-core
          ref: ${{ steps.release.outputs.hve_core_sha }}
          path: hve-core-source
          persist-credentials: false

      - name: Prepare distribution branch
        id: distribution
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.release.outputs.target_branch }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/hve-squad-plugin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ROOT"
          git -C "$ROOT" init --quiet
          git -C "$ROOT" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          OLD_VERSION=
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git -C "$ROOT" fetch --depth=1 origin "refs/heads/$TARGET_BRANCH"
            git -C "$ROOT" checkout --quiet -B "$TARGET_BRANCH" FETCH_HEAD
            if [[ -f "$ROOT/plugin.json" ]]; then
              OLD_VERSION=$(jq -r '.version // empty' "$ROOT/plugin.json")
            fi
            git -C "$ROOT" rm -r --quiet --ignore-unmatch .
          else
            git -C "$ROOT" checkout --quiet --orphan "$TARGET_BRANCH"
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate channel version
        shell: pwsh
        env:
          CHANNEL: ${{ inputs.channel }}
          OLD_VERSION: ${{ steps.distribution.outputs.old_version }}
          NEW_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $versionArgs = @{
            Channel    = $env:CHANNEL
            NewVersion = $env:NEW_VERSION
          }
          if ($env:OLD_VERSION) { $versionArgs['OldVersion'] = $env:OLD_VERSION }
          ./scripts/Assert-SquadPluginVersion.ps1 @versionArgs

      - name: Build self-contained plugin
        shell: pwsh
        env:
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          PLUGIN_VERSION: ${{ steps.release.outputs.version }}
          MARKETPLACE_NAME: ${{ steps.release.outputs.marketplace_name }}
          OUTPUT_ROOT: ${{ steps.distribution.outputs.root }}
        run: |
          ./scripts/Build-SquadPlugin.ps1 `
            -RepoRoot . `
            -Ref $env:SOURCE_REF `
            -HveCoreRoot ./hve-core-source `
            -OutputRoot $env:OUTPUT_ROOT `
            -PluginVersion $env:PLUGIN_VERSION `
            -MarketplaceName $env:MARKETPLACE_NAME

      - name: Commit and publish distribution branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT: ${{ steps.distribution.outputs.root }}
          OLD_VERSION: ${{ steps.distribution.outputs.old_version }}
          NEW_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          TARGET_BRANCH: ${{ steps.release.outputs.target_branch }}
        run: |
          set -euo pipefail
          git -C "$ROOT" add -A
          if git -C "$ROOT" diff --cached --quiet; then
            echo "::notice::$TARGET_BRANCH already matches $SOURCE_REF."
            exit 0
          fi
          if [[ -n "$OLD_VERSION" && "$OLD_VERSION" == "$NEW_VERSION" ]]; then
            echo "::error::Plugin content changed without a version change ($NEW_VERSION)."
            exit 1
          fi
          git -C "$ROOT" config user.name "github-actions[bot]"
          git -C "$ROOT" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$ROOT" commit -m "chore(plugin): publish $NEW_VERSION from $SOURCE_REF"
          git -C "$ROOT" push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Write installation summary
        shell: bash
        env:
          MARKETPLACE_NAME: ${{ steps.release.outputs.marketplace_name }}
          TARGET_BRANCH: ${{ steps.release.outputs.target_branch }}
          VERSION: ${{ steps.release.outputs.version }}
          HVE_CORE_SHA: ${{ steps.release.outputs.hve_core_sha }}
        run: |
          {
            echo "## Published hve-squad plugin"
            echo
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Plugin version: \`$VERSION\`"
            echo "- Bundled HVE Core: \`$HVE_CORE_SHA\`"
            echo
            echo '```text'
            echo "copilot plugin marketplace add Peter-N91/hve-squad#$TARGET_BRANCH"
            echo "copilot plugin install hve-squad@$MARKETPLACE_NAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
