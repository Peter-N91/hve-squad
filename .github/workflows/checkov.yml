# Checkov lint
# Mark "Checkov / Checkov IaC/container scan" as a required check.

name: Checkov IaC scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    name: Checkov IaC/container scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Checkov (pinned)
        # filelock is pulled in transitively. Versions below 3.20.3 carry
        # CVE-2026-22701 and CVE-2025-68146, both TOCTOU symlink races in
        # SoftFileLock, which OSV surfaces against this repository through the
        # OpenSSF Scorecard Vulnerabilities check. Constrain it to a fixed
        # release rather than accepting whatever checkov's range resolves to.
        run: python -m pip install checkov==3.2.533 "filelock>=3.20.3"

      - name: Run Checkov (blocking, SARIF)
        # Phase C: blocking. No --soft-fail — a failed check fails the build.
        # Accepted findings must use a justified inline `# checkov:skip`.
        # Checkov's `github_actions` runner only inspects files under
        # `.github/workflows/`, so shipped `.workflow.yml` templates under
        # `squad-src/` are staged ephemerally and remapped in SARIF.
        run: |
          set -euo pipefail

          map_file="${RUNNER_TEMP}/checkov-uri-map.json"
          staged_files=()
          cleanup() {
            if (( ${#staged_files[@]} > 0 )); then
              rm -f "${staged_files[@]}"
            fi
          }
          trap cleanup EXIT

          mapfile -t templates < <(find squad-src -type f -name '*.workflow.yml' | LC_ALL=C sort)
          if (( ${#templates[@]} == 0 )); then
            echo "::error::No shipped .workflow.yml templates found under squad-src/."
            exit 1
          fi

          printf '{}' > "$map_file"
          idx=0
          for tpl in "${templates[@]}"; do
            idx=$((idx + 1))
            base=$(basename "${tpl%.workflow.yml}" | tr -cs 'a-zA-Z0-9-' '-')
            staged=".github/workflows/staged-template-${idx}-${base}.yml"
            cp "$tpl" "$staged"
            staged_files+=("$staged")
            bare="${staged#.github/workflows/}"
            jq --arg s "$staged" --arg b "$bare" --arg t "$tpl" \
              '. + {($s): $t, ($b): $t}' "$map_file" > "${map_file}.tmp"
            mv "${map_file}.tmp" "$map_file"
          done

          rc=0
          checkov \
            --directory . \
            --framework github_actions secrets \
            --skip-path node_modules \
            --skip-path .venv \
            --compact \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-results.sarif || rc=$?

          if [[ -s checkov-results.sarif ]]; then
            jq --slurpfile map "$map_file" '
              ($map[0]) as $m
              | walk(
                  if type == "object" and (.uri? | type == "string") then
                    (($m[.uri] // $m[(.uri | sub("^(?:\\./|/)+"; ""))]) // null) as $mapped
                    | if $mapped != null then .uri = $mapped else . end
                  else
                    .
                  end
                )
              | (.runs[].results) |= unique_by([
                  .ruleId,
                  (.locations[0].physicalLocation.artifactLocation.uri // ""),
                  (.locations[0].physicalLocation.region.startLine // 0),
                  ((.suppressions // []) | length)
                ])
            ' checkov-results.sarif > "${RUNNER_TEMP}/checkov-results.remapped.sarif"
            mv "${RUNNER_TEMP}/checkov-results.remapped.sarif" checkov-results.sarif
          fi

          exit "$rc"

      - name: Checkov summary
        if: always()
        run: |
          {
            echo "### Checkov scan"
            echo ""
            if [[ -f checkov-results.sarif ]]; then
              jq -r '
                [.runs[].results[]] as $all
                | ($all | map(select((.suppressions // []) | length > 0))) as $suppressed
                | ($all | map(select((.suppressions // []) | length == 0))) as $open
                | "| Level | Count |",
                  "| --- | ---: |",
                  "| Errors | \($open | map(select(.level == "error")) | length) |",
                  "| Warnings | \($open | map(select(.level == "warning")) | length) |",
                  "| Notes | \($open | map(select(.level == "note")) | length) |",
                  "| Suppressed | \($suppressed | length) |",
                  "",
                  (if ($suppressed | length) > 0 then
                     "<details><summary>Suppressed findings</summary>",
                     "",
                     "| Rule | Location | Justification |",
                     "| --- | --- | --- |",
                     ($suppressed[] | "| \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.suppressions[0].justification | gsub("\\|"; "\\|") | gsub("\\s+"; " ")) |"),
                     "",
                     "</details>"
                   else empty end)
              ' checkov-results.sarif
            else
              echo "Checkov produced no SARIF output — see the job log."
            fi
            echo ""
            echo "See the job log for the full report. This check is blocking:"
            echo "new misconfigurations fail the build; accepted findings carry a"
            echo "justified inline \`# checkov:skip=<id>:<reason>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Drop suppressed results before upload
        if: always()
        # Code scanning ignores the SARIF `suppressions` property, so an inline
        # `# checkov:skip` would still surface as an open alert. Strip them here.
        run: |
          jq '(.runs[].results) |= map(select((.suppressions // []) | length == 0))' \
            checkov-results.sarif > checkov-code-scanning.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: checkov-code-scanning.sarif
          category: checkov

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: checkov-sarif
          path: checkov-results.sarif
          retention-days: 30