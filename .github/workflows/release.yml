name: Release

# Triggers:
#   workflow_dispatch — cuts a GitHub Release for the version in apm.yml.
#                       If a `version` input is provided, apm.yml is bumped
#                       to that version (and committed) before tagging.
#   push to main      — reads version from apm.yml; creates a GitHub Release if
#                       a matching tag does not exist yet. Expects the CHANGELOG
#                       to already contain an entry for that version.
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual release trigger (write access required); the version override is validated as semver before use.
    inputs:
      version:
        description: 'Optional: override version in apm.yml (e.g. 0.9.0). Leave blank to release the version already in apm.yml.'
        required: false
        type: string
      draft:
        description: 'Create as a draft release (review before publishing)'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch to cut the tag from. Leave as main unless releasing a hotfix branch.'
        required: false
        default: main
        type: string
      run_benchmark:
        description: 'Automatically collect fresh benchmark evidence before release. Uncheck only for an intentional manual bypass.'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apm.yml'
      - 'CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Freeze release candidate
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      tag_exists: ${{ steps.tag.outputs.exists }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.sha || inputs.ref || 'main' }}
      - name: Record candidate identity
        id: identity
        shell: pwsh
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -LiteralPath apm.yml -Raw
          $matches = [regex]::Matches($text, '(?m)^version: ([^\r\n]+)\r?$')
          if ($matches.Count -ne 1) { throw 'One candidate version required.' }
          $version = if ($env:VERSION_OVERRIDE) { $env:VERSION_OVERRIDE } else { $matches[0].Groups[1].Value }
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:[-+][0-9A-Za-z.-]+)?$') { throw 'Invalid effective release version.' }
          "sha=$((git rev-parse HEAD).Trim())", "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Skip paid collection when release tag already exists
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$([Uri]::EscapeDataString($env:RELEASE_VERSION))"
          $null = Invoke-RestMethod -Uri $uri -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable status
          if ($status -notin @(200, 404)) { throw 'Cannot determine whether release tag exists.' }
          "exists=$(([bool]($status -eq 200)).ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  benchmark:
    name: Benchmark before release
    needs: candidate
    if: needs.candidate.outputs.tag_exists == 'false' && (github.event_name != 'workflow_dispatch' || inputs.run_benchmark != false)
    permissions:
      contents: read
    uses: ./.github/workflows/tier2-benchmark.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      effective_version: ${{ needs.candidate.outputs.version }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  release:
    name: Create Release
    needs: [candidate, benchmark]
    runs-on: ubuntu-latest
    if: >
      always() && !cancelled() && needs.candidate.result == 'success' &&
      (needs.benchmark.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_benchmark == false &&
        needs.benchmark.result == 'skipped'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}

      - name: Record manual benchmark bypass
        if: github.event_name == 'workflow_dispatch' && inputs.run_benchmark == false
        run: |
          echo "::warning::Benchmark gate explicitly disabled for this manual release."
          echo "## Benchmark gate intentionally disabled by manual release input" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout frozen evidence validator
        if: needs.benchmark.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.benchmark.outputs.controller_repository }}
          ref: ${{ needs.benchmark.outputs.controller_sha }}
          path: .benchmark-controller
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Download exact current-run benchmark artifact
        if: needs.benchmark.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.benchmark.outputs.artifact_id }}
          path: .benchmark-public
          merge-multiple: true

      - name: Validate frozen campaign before publication
        if: needs.benchmark.result == 'success'
        shell: pwsh
        env:
          CONTROLLER: ${{ needs.benchmark.outputs.controller_sha }}
          CONTROLLER_REPOSITORY: ${{ needs.benchmark.outputs.controller_repository }}
          CANDIDATE: ${{ needs.candidate.outputs.sha }}
          EFFECTIVE_VERSION: ${{ needs.candidate.outputs.version }}
          MANIFEST_DIGEST: ${{ needs.benchmark.outputs.manifest_digest }}
        run: |
          git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules -- "https://github.com/$env:CONTROLLER_REPOSITORY.git" $env:CONTROLLER
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch frozen controller evidence.' }
          Import-Module ./.benchmark-controller/tests/tier2/live-benchmark/ReleaseBenchmark.psm1
          $null = Assert-ReleaseBenchmarkPublication -Repository $PWD -OutputDirectory (Join-Path $PWD '.benchmark-public') `
            -Controller $env:CONTROLLER -Candidate $env:CANDIDATE -EffectiveVersion $env:EFFECTIVE_VERSION `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -RepositorySlug $env:GITHUB_REPOSITORY -ManifestDigest $env:MANIFEST_DIGEST

      # ── Release gate ─────────────────────────────────────────────────────
      #    Tier 0 runs twice, and the two runs assert different things.
      #
      #    Here, before the tag exists, it can only run in source mode against the
      #    ref being released. That catches an undelivered agent, a roster naming
      #    something that was never packaged, a body over the host cap.
      #
      #    After the tag is pushed it runs again in ref mode, which is the only mode
      #    that can assert PKG-01 — that the tag pinned its own self-references. That
      #    check is un-runnable before tagging, because there is no ref to install.
      #
      #    Tier 1 is deliberately NOT wired in yet. It spends Copilot requests and has
      #    not yet run green twice in a row, and a release gate standing on a harness
      #    that has never executed is a liability, not a safeguard. Promote it here on
      #    the condition stated in tests/squad-behavior-contract.md, not before.
      - name: Set up the conformance suite
        id: suite
        shell: bash
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          if [[ -f tests/tier0/Invoke-Tier0Tests.ps1 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Tier 0 suite on '${REF}' — this release is UNGATED. Expected on any line at or above 0.16.0."
          fi

      - name: Install the APM CLI
        if: steps.suite.outputs.present == 'true'
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: 'true'
          apm-version: '0.18.0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pester
        if: steps.suite.outputs.present == 'true'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Tier 0 conformance of the ref being released
        if: steps.suite.outputs.present == 'true'
        shell: pwsh
        env:
          # Unauthenticated resolution hits the GitHub rate limit and APM then waits on
          # the reset rather than failing, which reads as a hung job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tests/tier0/Invoke-Tier0Tests.ps1 -SourceRoot . -Output Detailed

      # ── Manual dispatch only: bump apm.yml version if requested ─────────
      - name: Bump apm.yml version (manual override)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          NEW_VER="$INPUT_VERSION"
          # Reject anything that isn't a plain semver, so it can't break out of the sed below.
          if [[ ! "$NEW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version override '$NEW_VER'. Expected semver like 1.2.3."
            exit 1
          fi
          CURRENT=$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')
          if [[ "$CURRENT" == "$NEW_VER" ]]; then
            echo "::notice::apm.yml already at $NEW_VER — no commit needed."
          else
            sed -i "s/^version: .*/version: $NEW_VER/" apm.yml
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git add apm.yml
            git commit -m "chore(release): bump to $NEW_VER"
            git push origin "HEAD:${REF}"
          fi

      # ── Resolve version ──────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      # ── Guard: skip if tag already exists (e.g. re-run, stale push) ──────
      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $2}' | grep -qx "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Extract release notes from CHANGELOG.md ───────────────────────────
      - name: Extract CHANGELOG entry
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Matches lines like "## [0.8.2] - 2026-06-17"
          NOTES=$(awk -v ver="$VERSION" \
            'BEGIN{found=0}
             $0 ~ "^## \\[" ver "\\]" {found=1; next}
             found && /^## \[/{exit}
             found{print}' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for full details."
          fi
          printf '%s' "$NOTES" > release_notes.md

      # ── Pin squad self-references, then tag that commit ──────────────────
      #    The 47 Peter-N91/hve-squad entries in apm.yml ship as bare paths, and
      #    APM resolves a bare path against the default branch. Without this step a
      #    tag freezes the dependency *list* but not its *contents*: installing
      #    '#v0.14.0' was measured returning main's coordinator, while the hve-core
      #    entries in the same manifest resolved correctly because they carry '#<sha>'.
      #
      #    The manifest cannot name its own tag before the tag exists, so the pin
      #    lands in a commit pushed straight to refs/tags and never to main. main
      #    keeps the unpinned manifest, so development installs still track main.
      - name: Pin squad self-references and create the tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          BENCHMARK_REQUIRED: ${{ needs.benchmark.result == 'success' }}
          CONTROLLER: ${{ needs.benchmark.outputs.controller_sha }}
          CANDIDATE: ${{ needs.candidate.outputs.sha }}
          EFFECTIVE_VERSION: ${{ needs.candidate.outputs.version }}
          MANIFEST_DIGEST: ${{ needs.benchmark.outputs.manifest_digest }}
        run: |
          pwsh -File scripts/Set-SquadSelfRefPin.ps1 -ApmFile apm.yml -Ref "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add apm.yml
          git commit -m "chore(release): pin squad self-references to $TAG"
          if [[ "$BENCHMARK_REQUIRED" == "true" ]]; then
            pwsh -NoProfile -Command '
              Import-Module ./.benchmark-controller/tests/tier2/live-benchmark/ReleaseBenchmark.psm1
              $null = Assert-ReleaseBenchmarkPublication -Repository $PWD -OutputDirectory (Join-Path $PWD ".benchmark-public") `
                -Controller $env:CONTROLLER -Candidate $env:CANDIDATE -EffectiveVersion $env:EFFECTIVE_VERSION `
                -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -RepositorySlug $env:GITHUB_REPOSITORY -ManifestDigest $env:MANIFEST_DIGEST -BindFinalCommit
            '
          fi
          git push origin "HEAD:refs/tags/$TAG"
          echo "::notice::Tagged $TAG at a pinned manifest; main is unchanged."

      # ── Verify the published ref before anyone can install it ────────────
      #    A tag that froze the dependency list but not its contents is the defect
      #    that made earlier tags non-reproducible, and it is invisible until the tag
      #    exists. Failing here leaves a tag but no Release: recoverable, and loud.
      - name: Tier 0 conformance of the published tag
        if: steps.tag_check.outputs.exists == 'false' && steps.suite.outputs.present == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: ./tests/tier0/Invoke-Tier0Tests.ps1 -Ref $env:TAG -Output Detailed

      # ── Create GitHub Release (the tag already exists) ────────────
      - name: Create GitHub Release
        id: publish
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          BENCHMARK_REQUIRED: ${{ needs.benchmark.result == 'success' }}
        run: |
          ARGS=(
            "$TAG"
            --title "$TAG"
            --notes-file release_notes.md
          )
          if [[ "$BENCHMARK_REQUIRED" == "true" ]]; then
            ARGS+=(.benchmark-public/report.json .benchmark-public/report.md .benchmark-public/badge.svg
              .benchmark-public/identity.json .benchmark-public/base-record.json .benchmark-public/head-record.json)
          fi
          [[ "$DRAFT" == "true" ]] && ARGS+=(--draft)

          # A hotfix cut off an older line is newer by date but lower by version,
          # and GitHub would otherwise hand it the Latest badge over the release
          # that supersedes it.
          CURRENT_LATEST=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ -n "$CURRENT_LATEST" ]]; then
            HIGHEST=$(printf '%s\n%s\n' "${CURRENT_LATEST#v}" "$VERSION" | sort -V | tail -1)
            if [[ "$HIGHEST" != "$VERSION" ]]; then
              ARGS+=(--latest=false)
              echo "::notice::$TAG is lower than the current latest ($CURRENT_LATEST) — not marking it latest."
            fi
          fi

          gh release create "${ARGS[@]}"
