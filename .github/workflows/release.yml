name: Release

# Triggers:
#   workflow_dispatch — cuts a GitHub Release for the version in apm.yml.
#                       If a `version` input is provided, apm.yml is bumped
#                       to that version (and committed) before tagging.
#   push to main      — reads version from apm.yml; creates a GitHub Release if
#                       a matching tag does not exist yet. Expects the CHANGELOG
#                       to already contain an entry for that version.
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual release trigger (write access required); the version override is validated as semver before use.
    inputs:
      version:
        description: 'Optional: override version in apm.yml (e.g. 0.9.0). Leave blank to release the version already in apm.yml.'
        required: false
        type: string
      draft:
        description: 'Create as a draft release (review before publishing)'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch to cut the tag from. Leave as main unless releasing a hotfix branch.'
        required: false
        default: main
        type: string
      verify:
        description: 'Run the Tier 1 behavioral suite before tagging. Spends Copilot requests and adds roughly an hour. Clear only for a re-cut of a ref already verified.'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'apm.yml'
      - 'CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves the tag before anything is paid for. The behavioral gate below costs
  # Copilot requests and the better part of an hour, and a push that re-triggers this
  # workflow for a version already tagged must not spend either.
  preflight:
    name: Resolve the release
    runs-on: ubuntu-latest
    # Skip commits that were authored by this workflow to prevent push-loop.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      exists: ${{ steps.resolve.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || 'main' }}

      - name: Resolve version and tag state
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # The manual override is applied to apm.yml later, inside the release job, so
          # the tag being checked here has to honour it up front.
          VERSION="${INPUT_VERSION:-$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')}"
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $2}' | grep -qx "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG already exists — nothing to verify or release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Behavioral gate ───────────────────────────────────────────────────────
  #    Tier 0 proves the package is well-formed. Only this tier proves the squad still
  #    routes, dispatches, and accounts for what it did, and it is the one that has
  #    caught every behavioral regression on this line so far.
  #
  #    Source mode, before the tag exists, because that is the only point where a
  #    failure is free to act on — after tagging the only remedies are a hotfix or a
  #    deleted tag. Tier 0 still runs a second time against the published tag, since
  #    self-reference pinning cannot be asserted before there is a ref to install.
  #
  #    Tier 2 rides along inside this call and scores the runs against the golden
  #    baselines in tests/tier2/baselines. It is advisory: until the noise floor across
  #    repeat runs on one ref is known, a low score is not evidence of a regression.
  behavior:
    name: Tier 1 behavior
    needs: preflight
    if: >
      needs.preflight.outputs.exists == 'false' &&
      (github.event_name != 'workflow_dispatch' || inputs.verify)
    permissions:
      contents: read
      # Tier 2 is nested inside this call and reads the run's artifacts through the API.
      actions: read
    uses: ./.github/workflows/tier1-behavior.yml
    with:
      # Blank ref means source mode: exercise this checkout, which is what is about to
      # become the tag.
      ref: ''
      compare: true
    secrets:
      copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [preflight, behavior]
    if: >
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.exists == 'false' &&
      (needs.behavior.result == 'success' || needs.behavior.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref || 'main' }}

      # ── Release gate ─────────────────────────────────────────────────────
      #    Tier 0 runs twice, and the two runs assert different things.
      #
      #    Here, before the tag exists, it can only run in source mode against the
      #    ref being released. That catches an undelivered agent, a roster naming
      #    something that was never packaged, a body over the host cap.
      #
      #    After the tag is pushed it runs again in ref mode, which is the only mode
      #    that can assert PKG-01 — that the tag pinned its own self-references. That
      #    check is un-runnable before tagging, because there is no ref to install.
      #
      #    Tier 1 and Tier 2 already ran in the `behavior` job above and this job does
      #    not start unless they passed or were deliberately skipped.
      - name: Set up the conformance suite
        id: suite
        shell: bash
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          if [[ -f tests/tier0/Invoke-Tier0Tests.ps1 ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Tier 0 suite on '${REF}' — this release is UNGATED. Expected on any line at or above 0.16.0."
          fi

      - name: Install the APM CLI
        if: steps.suite.outputs.present == 'true'
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: 'true'
          apm-version: '0.18.0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Pester
        if: steps.suite.outputs.present == 'true'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Tier 0 conformance of the ref being released
        if: steps.suite.outputs.present == 'true'
        shell: pwsh
        env:
          # Unauthenticated resolution hits the GitHub rate limit and APM then waits on
          # the reset rather than failing, which reads as a hung job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tests/tier0/Invoke-Tier0Tests.ps1 -SourceRoot . -Output Detailed

      # ── Manual dispatch only: bump apm.yml version if requested ─────────
      - name: Bump apm.yml version (manual override)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          NEW_VER="$INPUT_VERSION"
          # Reject anything that isn't a plain semver, so it can't break out of the sed below.
          if [[ ! "$NEW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version override '$NEW_VER'. Expected semver like 1.2.3."
            exit 1
          fi
          CURRENT=$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')
          if [[ "$CURRENT" == "$NEW_VER" ]]; then
            echo "::notice::apm.yml already at $NEW_VER — no commit needed."
          else
            sed -i "s/^version: .*/version: $NEW_VER/" apm.yml
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git add apm.yml
            git commit -m "chore(release): bump to $NEW_VER"
            git push origin "HEAD:${REF}"
          fi

      # ── Resolve version ──────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      # ── Guard: skip if tag already exists (e.g. re-run, stale push) ──────
      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $2}' | grep -qx "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Extract release notes from CHANGELOG.md ───────────────────────────
      - name: Extract CHANGELOG entry
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Matches lines like "## [0.8.2] - 2026-06-17"
          NOTES=$(awk -v ver="$VERSION" \
            'BEGIN{found=0}
             $0 ~ "^## \\[" ver "\\]" {found=1; next}
             found && /^## \[/{exit}
             found{print}' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for full details."
          fi
          printf '%s' "$NOTES" > /tmp/release_notes.md

      # ── Pin squad self-references, then tag that commit ──────────────────
      #    The 47 Peter-N91/hve-squad entries in apm.yml ship as bare paths, and
      #    APM resolves a bare path against the default branch. Without this step a
      #    tag freezes the dependency *list* but not its *contents*: installing
      #    '#v0.14.0' was measured returning main's coordinator, while the hve-core
      #    entries in the same manifest resolved correctly because they carry '#<sha>'.
      #
      #    The manifest cannot name its own tag before the tag exists, so the pin
      #    lands in a commit pushed straight to refs/tags and never to main. main
      #    keeps the unpinned manifest, so development installs still track main.
      - name: Pin squad self-references and create the tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pwsh -File scripts/Set-SquadSelfRefPin.ps1 -ApmFile apm.yml -Ref "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add apm.yml
          git commit -m "chore(release): pin squad self-references to $TAG"
          git push origin "HEAD:refs/tags/$TAG"
          echo "::notice::Tagged $TAG at a pinned manifest; main is unchanged."

      # ── Verify the published ref before anyone can install it ────────────
      #    A tag that froze the dependency list but not its contents is the defect
      #    that made earlier tags non-reproducible, and it is invisible until the tag
      #    exists. Failing here leaves a tag but no Release: recoverable, and loud.
      - name: Tier 0 conformance of the published tag
        if: steps.tag_check.outputs.exists == 'false' && steps.suite.outputs.present == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: ./tests/tier0/Invoke-Tier0Tests.ps1 -Ref $env:TAG -Output Detailed

      # ── Create GitHub Release (the tag already exists) ────────────
      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          ARGS=(
            "$TAG"
            --title "$TAG"
            --notes-file /tmp/release_notes.md
          )
          [[ "$DRAFT" == "true" ]] && ARGS+=(--draft)

          # A hotfix cut off an older line is newer by date but lower by version,
          # and GitHub would otherwise hand it the Latest badge over the release
          # that supersedes it.
          CURRENT_LATEST=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ -n "$CURRENT_LATEST" ]]; then
            HIGHEST=$(printf '%s\n%s\n' "${CURRENT_LATEST#v}" "$VERSION" | sort -V | tail -1)
            if [[ "$HIGHEST" != "$VERSION" ]]; then
              ARGS+=(--latest=false)
              echo "::notice::$TAG is lower than the current latest ($CURRENT_LATEST) — not marking it latest."
            fi
          fi

          gh release create "${ARGS[@]}"
