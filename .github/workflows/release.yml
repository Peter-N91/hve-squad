name: Release

# Triggered explicitly by Release Prep, or manually for a hotfix/direct release.
# Dependency-pin pushes must not rehearse or cut a release.
on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual release trigger (write access required); the version override is validated as semver before use.
    inputs:
      version:
        description: 'Optional: override version in apm.yml (e.g. 0.9.0). Leave blank to release the version already in apm.yml.'
        required: false
        type: string
      draft:
        description: 'Create as a draft release (review before publishing)'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch to cut the tag from. Leave as main unless releasing a hotfix branch.'
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Freeze release candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      suite_present: ${{ steps.identity.outputs.suite_present }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || 'main' }}
      - name: Record candidate identity
        id: identity
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -f tests/tier0/Invoke-Tier0Tests.ps1 ]]; then
            echo "suite_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "suite_present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Tier 0 suite on '${REF}' — this release is UNGATED. Expected on any line at or above 0.16.0."
          fi

  # Repository contracts need the source checkout, but no APM installation.
  # Package/runtime cases run only after tagging, against the consumer install.
  source_conformance:
    name: Repository conformance before tagging
    needs: candidate
    if: needs.candidate.outputs.suite_present == 'true'
    uses: ./.github/workflows/tier0-conformance.yml
    with:
      source-ref: ${{ needs.candidate.outputs.sha }}
      scope: Repository

  tag:
    name: Create release tag
    needs: [candidate, source_conformance]
    if: >-
      always() && needs.candidate.result == 'success' &&
      (needs.source_conformance.result == 'success' || needs.candidate.outputs.suite_present == 'false')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.tag_check.outputs.exists }}
      sha: ${{ steps.identity.outputs.sha }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.candidate.outputs.sha }}

      # ── Manual dispatch only: bump apm.yml version if requested ─────────
      - name: Bump apm.yml version (manual override)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          NEW_VER="$INPUT_VERSION"
          # Reject anything that isn't a plain semver, so it can't break out of the sed below.
          if [[ ! "$NEW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version override '$NEW_VER'. Expected semver like 1.2.3."
            exit 1
          fi
          CURRENT=$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')
          if [[ "$CURRENT" == "$NEW_VER" ]]; then
            echo "::notice::apm.yml already at $NEW_VER — no commit needed."
          else
            sed -i "s/^version: .*/version: $NEW_VER/" apm.yml
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            git add apm.yml
            git commit -m "chore(release): bump to $NEW_VER"
            git push origin "HEAD:${REF}"
          fi

      # ── Resolve version ──────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep '^version:' apm.yml | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

      # ── Guard: skip if tag already exists (e.g. re-run, stale push) ──────
      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $2}' | grep -qx "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Pin squad self-references, then tag that commit ──────────────────
      #    The 47 Peter-N91/hve-squad entries in apm.yml ship as bare paths, and
      #    APM resolves a bare path against the default branch. Without this step a
      #    tag freezes the dependency *list* but not its *contents*: installing
      #    '#v0.14.0' was measured returning main's coordinator, while the hve-core
      #    entries in the same manifest resolved correctly because they carry '#<sha>'.
      #
      #    The manifest cannot name its own tag before the tag exists, so the pin
      #    lands in a commit pushed straight to refs/tags and never to main. main
      #    keeps the unpinned manifest, so development installs still track main.
      - name: Pin squad self-references and create the tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pwsh -File scripts/Set-SquadSelfRefPin.ps1 -ApmFile apm.yml -Ref "$TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add apm.yml
          git commit -m "chore(release): pin squad self-references to $TAG"
          git push origin "HEAD:refs/tags/$TAG"
          echo "::notice::Tagged $TAG at a pinned manifest; main is unchanged."

      - name: Record tagged identity
        if: steps.tag_check.outputs.exists == 'false'
        id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The entire installed-package selection, including PKG-01, runs exactly once.
  # No Release exists until every shard passes. Failed installs/tests leave a tag,
  # not a success-shaped published release.
  published_conformance:
    name: Published package conformance
    needs: [candidate, tag]
    if: needs.tag.outputs.exists == 'false' && needs.candidate.outputs.suite_present == 'true'
    uses: ./.github/workflows/tier0-conformance.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
      source-ref: ${{ needs.tag.outputs.sha }}
      scope: Package

  release:
    name: Create Release
    needs: [candidate, tag, published_conformance]
    if: >-
      always() && needs.tag.result == 'success' && needs.tag.outputs.exists == 'false' &&
      (needs.published_conformance.result == 'success' || needs.candidate.outputs.suite_present == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.sha }}

      - name: Extract CHANGELOG entry
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          NOTES=$(awk -v ver="$VERSION" \
            'BEGIN{found=0}
             $0 ~ "^## \\[" ver "\\]" {found=1; next}
             found && /^## \[/{exit}
             found{print}' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for full details."
          fi
          printf '%s' "$NOTES" > /tmp/release_notes.md

      # ── Create GitHub Release (the tag already exists) ────────────
      - name: Create GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          ARGS=(
            "$TAG"
            --title "$TAG"
            --notes-file /tmp/release_notes.md
          )
          [[ "$DRAFT" == "true" ]] && ARGS+=(--draft)

          # A hotfix cut off an older line is newer by date but lower by version,
          # and GitHub would otherwise hand it the Latest badge over the release
          # that supersedes it.
          CURRENT_LATEST=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          if [[ -n "$CURRENT_LATEST" ]]; then
            HIGHEST=$(printf '%s\n%s\n' "${CURRENT_LATEST#v}" "$VERSION" | sort -V | tail -1)
            if [[ "$HIGHEST" != "$VERSION" ]]; then
              ARGS+=(--latest=false)
              echo "::notice::$TAG is lower than the current latest ($CURRENT_LATEST) — not marking it latest."
            fi
          fi

          gh release create "${ARGS[@]}"

      # GITHUB_TOKEN release writes do not trigger the Pages release event.
      - name: Refresh published documentation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
