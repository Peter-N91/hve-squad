name: Tier 2 Benchmark

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Frozen release candidate
        required: true
        type: string
      effective_version:
        description: Version that publication will use, including a manual override
        required: true
        type: string
      refresh_reference:
        description: Explicitly replace historical comparison with six fresh paired observations
        required: false
        default: false
        type: boolean
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
    outputs:
      controller_sha:
        value: ${{ jobs.collect.outputs.controller }}
      controller_repository:
        value: ${{ jobs.collect.outputs.controller_repository }}
      artifact_id:
        value: ${{ jobs.collect.outputs.artifact }}
      manifest_digest:
        value: ${{ jobs.collect.outputs.manifest }}
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Authorized paid diagnostics; optional immutable SHAs default to the selected branch and reviewed default branch.
    inputs:
      base_sha:
        description: Optional reviewed default-branch controller SHA (blank freezes default branch)
        required: false
        type: string
      head_sha:
        description: Optional candidate SHA (blank uses selected branch)
        required: false
        type: string
      refresh_reference:
        description: Explicit six-observation parent refresh (never automatic)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tier2-benchmark-${{ inputs.candidate_sha || inputs.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Stored parent and fresh candidate benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      controller: ${{ steps.refs.outputs.controller }}
      controller_repository: ${{ steps.refs.outputs.controller_repository }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      manifest: ${{ steps.collect.outputs.manifest }}
    steps:
      - name: Freeze reviewed controller and candidate
        id: refs
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BASE: ${{ inputs.base_sha }}
          INPUT_HEAD: ${{ inputs.candidate_sha || inputs.head_sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          $metadata = (& gh api "repos/$env:GITHUB_REPOSITORY") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve reviewed default branch.' }
          $controllerRepository = $env:GITHUB_REPOSITORY
          if ($metadata.fork) {
            $controllerRepository = $metadata.parent.full_name
            $defaultBranch = $metadata.parent.default_branch
          } else { $defaultBranch = $metadata.default_branch }
          if ($controllerRepository -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Invalid controller repository.' }
          $tip = (& gh api "repos/$controllerRepository/commits/$([Uri]::EscapeDataString($defaultBranch))" --jq '.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $tip -cnotmatch '^[0-9a-f]{40}$') { throw 'Cannot freeze reviewed controller.' }
          # A manual base is accepted only if it is the reviewed current tip.
          if ($env:INPUT_BASE -and $env:INPUT_BASE -cne $tip) { throw 'Controller must be the reviewed default-branch tip.' }
          if ($env:INPUT_HEAD -cnotmatch '^[0-9a-f]{40}$') { throw 'Candidate must be a full commit SHA.' }
          "controller=$tip", "controller_repository=$controllerRepository", "candidate=$env:INPUT_HEAD" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Checkout frozen reviewed controller
        timeout-minutes: 10
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.refs.outputs.controller_repository }}
          ref: ${{ steps.refs.outputs.controller }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Validate sources and read reviewed spending policy before installation
        id: preflight
        timeout-minutes: 5
        shell: pwsh
        env:
          CONTROLLER: ${{ steps.refs.outputs.controller }}
          CANDIDATE: ${{ steps.refs.outputs.candidate }}
          EFFECTIVE_VERSION: ${{ inputs.effective_version }}
          REFRESH_REFERENCE: ${{ inputs.refresh_reference || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules -- "https://github.com/$env:GITHUB_REPOSITORY.git" $env:CANDIDATE
          if ($LASTEXITCODE -ne 0 -or (git rev-parse FETCH_HEAD).Trim() -cne $env:CANDIDATE) { throw 'Candidate fetch failed.' }
          if (-not $env:EFFECTIVE_VERSION) {
            $manifest = (git show "$($env:CANDIDATE):apm.yml") -join "`n"
            if ($LASTEXITCODE -ne 0 -or $manifest -cnotmatch '(?m)^version: ([0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?)\r?$') { throw 'Candidate version unavailable.' }
            $env:EFFECTIVE_VERSION = $Matches[1]
          }
          Import-Module ./tests/tier2/live-benchmark/ReleaseBenchmark.psm1
          $context = Get-ReleaseBenchmarkPreflight -Repository $PWD -Controller $env:CONTROLLER -Candidate $env:CANDIDATE -EffectiveVersion $env:EFFECTIVE_VERSION -RefreshReference:($env:REFRESH_REFERENCE -ceq 'true')
          "cli=$($context.policy.cliVersion)", "version=$env:EFFECTIVE_VERSION" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Install the APM CLI
        timeout-minutes: 10
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          setup-only: 'true'
          apm-version: '0.29.0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pinned CLI without automatic updates
        timeout-minutes: 10
        # zizmor: ignore[adhoc-packages] - exact reviewed policy pin; no floating package version.
        shell: bash
        env:
          CLI_VERSION: ${{ steps.preflight.outputs.cli }}
        run: |
          npm install -g "@github/copilot@${CLI_VERSION}"
          mkdir -p .benchmark-private/bin
          COPILOT_BIN="$(command -v copilot)"
          printf '#!/usr/bin/env bash\nexec "%s" --no-auto-update "$@"\n' "$COPILOT_BIN" > .benchmark-private/bin/copilot
          chmod 700 .benchmark-private/bin/copilot

      - name: Prepare source-bound dependency installs without Copilot credentials
        timeout-minutes: 40
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROLLER: ${{ steps.refs.outputs.controller }}
          CANDIDATE: ${{ steps.refs.outputs.candidate }}
          EFFECTIVE_VERSION: ${{ steps.preflight.outputs.version }}
          REFRESH_REFERENCE: ${{ inputs.refresh_reference || false }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./tests/tier2/live-benchmark/ReleaseBenchmark.psm1
          Import-Module ./tests/lib/SquadInstall.psm1
          $context = Get-ReleaseBenchmarkPreflight -Repository $PWD -Controller $env:CONTROLLER -Candidate $env:CANDIDATE -EffectiveVersion $env:EFFECTIVE_VERSION -RefreshReference:($env:REFRESH_REFERENCE -ceq 'true')
          foreach ($arm in $context.arms) {
            $revision = if ($arm -eq 'baseline') { $context.reference } else { $env:CANDIDATE }
            $source = Join-Path $PWD ".benchmark-private/sources/$arm"
            git -c core.hooksPath=/dev/null worktree add --detach $source $revision
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare frozen source.' }
            $null = Install-SquadPackage -SourceRoot $source -Destination (Join-Path $PWD ".benchmark-private/install/$arm")
          }

      - name: Collect original candidate observations and compare in the requested mode
        id: collect
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          CONTROLLER: ${{ steps.refs.outputs.controller }}
          CANDIDATE: ${{ steps.refs.outputs.candidate }}
          EFFECTIVE_VERSION: ${{ steps.preflight.outputs.version }}
          STARTED: ${{ steps.refs.outputs.started }}
          REFRESH_REFERENCE: ${{ inputs.refresh_reference || false }}
        run: |
          Import-Module ./tests/tier2/live-benchmark/ReleaseBenchmark.psm1
          $report = Invoke-ReleaseBenchmark -Repository $PWD -Controller $env:CONTROLLER -Candidate $env:CANDIDATE -EffectiveVersion $env:EFFECTIVE_VERSION `
            -InstallRoot (Join-Path $PWD '.benchmark-private/install') -CliPath (Join-Path $PWD '.benchmark-private/bin/copilot') `
            -PrivateRoot (Join-Path $PWD '.benchmark-private/campaign') -OutputDirectory (Join-Path $PWD '.benchmark-public') `
            -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -RepositorySlug $env:GITHUB_REPOSITORY -Started ([DateTimeOffset]::Parse($env:STARTED)) `
            -RefreshReference:($env:REFRESH_REFERENCE -ceq 'true')
          $digest = (Get-FileHash .benchmark-public/identity.json).Hash.ToLowerInvariant()
          "manifest=$digest", "verdict=$($report.exitCode)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          exit ([int]$report.exitCode)

      - name: Finalize sanitized failure evidence and summary
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $PWD '.benchmark-public'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $path = Join-Path $root 'report.md'
          if (-not (Test-Path -LiteralPath $path)) {
            '# Efficiency benchmark: operational failure before collection. No passing result.' | Set-Content -LiteralPath $path
            @{ schemaVersion = 'benchmark-report-v1'; status = 'operational-error'; exitCode = 1; reasons = @('workflow-preflight-failed') } |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'report.json')
          }
          Get-Content -LiteralPath $path -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Apply temporary release baseline bootstrap
        id: gate
        if: always()
        shell: pwsh
        env:
          VERDICT: ${{ steps.collect.outputs.verdict }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          COLLECTION_REQUIRED: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $verdict = $env:VERDICT
          if ($verdict -notmatch '^[0-3]$') { $verdict = '1' }
          # Retained legacy stored-comparison policy; never admits a fresh collection failure.
          if ($env:COLLECTION_REQUIRED -cne 'true' -and $verdict -eq '2' -and $env:CANDIDATE_SHA -cmatch '^[0-9a-f]{40}$') {
            $reportPath = Join-Path $env:RUNNER_TEMP 'efficiency-report/report.json'
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            $bootstrapReasons = @('base-comparison-tooling-unavailable', 'previous-stable-release-unavailable')
            if ($report.status -ceq 'missing-baseline' -and @($report.reasons).Count -eq 1 -and $report.reasons[0] -cin $bootstrapReasons) {
              $manifest = git show "$($env:CANDIDATE_SHA):apm.yml"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read frozen candidate version.' }
              $versions = [regex]::Matches(($manifest -join "`n"), '(?m)^version: (0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\r?$')
              if ($versions.Count -ne 1) { throw 'One stable candidate version required for baseline bootstrap.' }
              $version = [version]($versions[0].Value.Substring(9).Trim())
              if ($version -le [version]'0.18.1') {
                $verdict = '0'
                $message = "Temporary legacy bootstrap: missing baseline allowed for $version (expires after v0.18.1). No benchmark approval; original report unchanged."
                Write-Host "::warning::$message"
                $message | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              }
            }
          }
          "verdict=$verdict" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Upload allowlisted sanitized evidence, including failures
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .benchmark-public/report.json
            .benchmark-public/report.md
            .benchmark-public/badge.svg
            .benchmark-public/identity.json
            .benchmark-public/base-record.json
            .benchmark-public/head-record.json
          if-no-files-found: error
          retention-days: 30

      - name: Propagate collection and comparison verdict
        if: always()
        shell: pwsh
        env:
          VERDICT: ${{ steps.gate.outputs.verdict }}
        run: |
          if ($env:VERDICT -notmatch '^[0-3]$') { exit 1 }
          exit ([int]$env:VERDICT)
