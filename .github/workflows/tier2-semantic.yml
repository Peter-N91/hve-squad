name: Tier 2 Semantic

# Scores Tier 1 runs against the golden baselines captured from the last good release.
#
# Tier 0 asks "is the package well-formed". Tier 1 asks "did the work actually happen".
# Neither can see a squad that still writes a valid tree while routing to a different
# cast, landing deliverables somewhere else, or dropping a gate. That is the drift this
# workflow measures.
#
# Advisory on purpose. Until the noise floor across repeat runs on the same ref is
# known, a low score is not yet evidence of a regression, and a tier that blocks a
# release on unmeasured variance would be turned off within a week. Set `blocking` only
# once the same ref scores consistently.
#
# Normally invoked by tier1-behavior.yml, which produces the observations it reads. The
# workflow_dispatch path re-scores an earlier run without paying for it again.

on:
  # The comparator's own self-check spends nothing, so it gates every pull request that
  # touches it.
  pull_request:
    branches:
      - main
    paths:
      - 'tests/tier2/**'
      - '.github/workflows/tier2-semantic.yml'
  workflow_call:
    inputs:
      artifact-pattern:
        description: 'Artifact name pattern holding the Tier 1 observations.'
        required: false
        type: string
        default: 'tier1-*'
      run-id:
        description: 'Run to pull observations from. Blank uses the current run.'
        required: false
        type: string
        default: ''
      threshold:
        description: 'Minimum overall score per scenario.'
        required: false
        type: number
        default: 0.85
      blocking:
        description: 'Fail the job when a scored scenario falls below the threshold.'
        required: false
        type: boolean
        default: false
      judge-answer:
        description: 'Score the prose dimension with a model. Costs Copilot requests.'
        required: false
        type: boolean
        default: false
      capture-baseline:
        description: 'Write these observations as the golden baselines instead of scoring them.'
        required: false
        type: boolean
        default: false
      model:
        description: 'Model to pin for the answer judge.'
        required: false
        type: string
        default: 'claude-sonnet-5'
    secrets:
      copilot-token:
        description: 'PAT carrying the Copilot Requests permission. Only used when judge-answer is set.'
        required: false
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual trigger; inputs are passed via env and only reach comparison arguments.
    inputs:
      run-id:
        description: 'Tier 1 run id to pull observations from.'
        required: true
      threshold:
        description: 'Minimum overall score per scenario.'
        required: false
        default: '0.85'
      judge-answer:
        description: 'Score the prose dimension with a model.'
        required: false
        type: boolean
        default: false

concurrency:
  group: tier2-${{ inputs.run-id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Drift controls for the comparator: each one breaks a known-good pair in exactly one
  # way and requires the score for that dimension - and only that dimension - to move.
  selfcheck:
    name: Comparator self-check
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run the self-check
        shell: pwsh
        run: ./tests/tier2/Invoke-Tier2Tests.ps1 -Output Detailed

  compare:
    name: Compare against baselines
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only needed to reach a previous run's artifacts on the dispatch path.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Tier 1 observations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern || 'tier1-*' }}
          path: tier1-observations
          merge-multiple: true
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned GitHub Copilot CLI
        if: ${{ inputs.judge-answer }}
        env:
          COPILOT_CLI_VERSION: '1.0.78'
        # zizmor: ignore[adhoc-packages] - the CLI ships only via npm and has no lockfile to install from; the exact pin above is the mitigation.
        run: npm install -g "@github/copilot@${COPILOT_CLI_VERSION}"

      - name: Compare
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-token }}
          INPUT_THRESHOLD: ${{ inputs.threshold || '0.85' }}
          INPUT_BLOCKING: ${{ inputs.blocking }}
          INPUT_JUDGE: ${{ inputs.judge-answer }}
          INPUT_CAPTURE: ${{ inputs.capture-baseline }}
          INPUT_MODEL: ${{ inputs.model || 'claude-sonnet-5' }}
        run: |
          $arguments = @{
            ObservationRoot = './tier1-observations'
            Threshold       = [double]$env:INPUT_THRESHOLD
            Model           = $env:INPUT_MODEL
            ResultPath      = './tier2-score.json'
          }
          if ($env:INPUT_BLOCKING -eq 'true') { $arguments.Blocking = $true }
          if ($env:INPUT_JUDGE -eq 'true') { $arguments.JudgeAnswer = $true }
          if ($env:INPUT_CAPTURE -eq 'true') { $arguments.UpdateBaseline = $true }

          ./tests/tier2/Compare-SquadRun.ps1 @arguments

      # A captured baseline is committed by a human after review: a workflow that could
      # rewrite its own reference point could also quietly bless a regression.
      - name: Upload captured baselines
        if: ${{ inputs.capture-baseline }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-baselines
          path: tests/tier2/baselines
          retention-days: 14

      - name: Upload score
        if: ${{ always() && !inputs.capture-baseline }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tier2-score
          path: tier2-score.json
          if-no-files-found: warn
          retention-days: 14
