name: Tier 0 Conformance

# Static conformance of the package a consumer actually receives.
#
# No model is invoked and no secret is read, so this can gate every pull request
# as well as a release. See tests/squad-behavior-contract.md for the case list.
#
# Two modes, because a pull request branch cannot be installed:
#   source mode (pull_request) — installs the manifest, then overlays the branch's
#     squad-src/ on top. The manifest's self-references are bare paths, so APM
#     resolves them against the default branch and every file a branch ADDS is
#     reported missing; overlaying is what makes the branch testable at all.
#   ref mode (workflow_call, workflow_dispatch) — installs a published ref exactly
#     as a consumer would. This is the release gate, and the only mode that can
#     assert the manifest pinned itself (PKG-01).
#
# Independent file-level shards retain the complete selection, with one aggregate
# "Package conformance" check for branch protection. Release callers select
# repository-only or installed-package cases rather than repeating both.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'squad-src/**'
      - 'scripts/Build-SquadPlugin.ps1'
      - 'scripts/plugin-hooks/**'
      - 'apm.yml'
      - 'tests/tier0/**'
      - 'tests/lib/**'
      - '.github/workflows/tier0-conformance.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    paths:
      - 'squad-src/**'
      - 'scripts/Build-SquadPlugin.ps1'
      - 'scripts/plugin-hooks/**'
      - 'apm.yml'
      - 'tests/tier0/**'
      - 'tests/lib/**'
      - '.github/workflows/tier0-conformance.yml'
      - '.github/workflows/release.yml'
  workflow_call:
    inputs:
      ref:
        description: 'Published ref to install and assert, for example v0.16.0.'
        required: false
        default: ''
        type: string
      source-ref:
        description: 'Immutable checkout for the suite and source mode; defaults to the event commit.'
        required: false
        default: ''
        type: string
      scope:
        description: 'All, Repository (no installation), or Package.'
        required: false
        default: All
        type: string
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual trigger for testing a published ref; the input is passed via env and only ever reaches an apm install argument.
    inputs:
      ref:
        description: 'Published ref to install. Leave blank to test this checkout in source mode.'
        required: false
        default: ''
        type: string

concurrency:
  # A release caller must not cancel the independent main integration check, or
  # its own complementary source/tag call.
  group: ${{ github.workflow }}-tier0-${{ github.event.pull_request.number || inputs.source-ref || inputs.ref || github.ref }}-${{ inputs.scope || 'All' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select conformance shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      shards: ${{ steps.plan.outputs.shards }}
      modern: ${{ steps.plan.outputs.modern }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}

      - name: Select the exact test plan
        id: plan
        shell: pwsh
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SCOPE: ${{ inputs.scope || 'All' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = Get-Command ./tests/tier0/Invoke-Tier0Tests.ps1 -ErrorAction Stop
          $modern = $runner.Parameters.ContainsKey('Scope') -and $runner.Parameters.ContainsKey('Shard')
          if ($modern) {
            Import-Module ./tests/tier0/Tier0TestPlan.psm1 -Force
            $mode = if ($env:INPUT_REF) { 'Installed' } else { 'Source' }
            $plan = @(Get-Tier0TestPlan -Mode $mode -Scope $env:INPUT_SCOPE)
            $shards = @($plan.Shard | Select-Object -Unique)
            if ($shards.Count -eq 0) { throw 'No Tier 0 shards selected.' }
          }
          else {
            Write-Warning 'Legacy hotfix runner: preserving its complete, unsharded suite instead of skipping unsupported selections.'
            $shards = @('All')
          }
          $sha = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') { throw 'Cannot freeze the Tier 0 checkout.' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "modern=$($modern.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "shards=$(ConvertTo-Json -InputObject $shards -Compress)" >> $env:GITHUB_OUTPUT

  conformance:
    name: Tier 0 (${{ matrix.shard }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.plan.outputs.modern == 'true' && 25 || 60 }}
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      # setup-only: the suite drives apm itself, so it needs the CLI and nothing else.
      - name: Install the APM CLI
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        if: inputs.scope != 'Repository' || needs.plan.outputs.modern != 'true'
        with:
          setup-only: 'true'
          apm-version: '0.18.0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Pinned to 5.x: Pester 6 changes -ForEach and configuration semantics, and this
      # suite is authored and verified against 5.
      - name: Install Pester
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction Stop
              break
            }
            catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Pester install attempt $attempt failed; retrying."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

      - name: Run Tier 0
        shell: pwsh
        env:
          # Unauthenticated resolution hits the GitHub rate limit and APM then waits
          # on the reset rather than failing, which reads as a hung job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.ref }}
          # HEAD^1 is the base of the exact PR merge tree under test.
          TIER0_BASE_SHA: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
          INPUT_SCOPE: ${{ inputs.scope || 'All' }}
          INPUT_SHARD: ${{ matrix.shard }}
          MODERN_RUNNER: ${{ needs.plan.outputs.modern }}
        run: |
          $testArgs = @{
            Output = 'Detailed'
            ScratchRoot = Join-Path $env:RUNNER_TEMP 'tier0-install'
          }
          if ($env:MODERN_RUNNER -eq 'true') {
            $testArgs.Scope = $env:INPUT_SCOPE
            $testArgs.Shard = $env:INPUT_SHARD
          }
          if ($env:INPUT_REF) {
            ./tests/tier0/Invoke-Tier0Tests.ps1 -Ref $env:INPUT_REF @testArgs
          }
          else {
            ./tests/tier0/Invoke-Tier0Tests.ps1 -SourceRoot . @testArgs
          }

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          $path = 'tests/tier0/tier0-results.xml'
          if (-not (Test-Path -LiteralPath $path)) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Tier 0 produced no result file - the run failed before Pester started.'
            return
          }

          [xml]$results = Get-Content -LiteralPath $path -Raw
          $run = $results.'test-results'
          $lines = @(
            '## Tier 0 conformance'
            ''
            "Total **$($run.total)** &middot; failures **$($run.failures)** &middot; skipped **$($run.skipped)**"
          )

          $failed = @($results.SelectNodes('//test-case[@success="False" and @executed="True"]') | ForEach-Object { "- ``$($_.name)``" })
          if ($failed) {
            $lines += @('', '### Failing cases', '') + $failed
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n")

      - name: Retain shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier0-${{ inputs.scope || 'All' }}-${{ matrix.shard }}
          path: tests/tier0/tier0-results.xml
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  required:
    name: Package conformance
    if: always()
    needs: [plan, conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected shard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.conformance.result }}
        run: |
          if [[ "$PLAN_RESULT" != success || "$SHARD_RESULT" != success ]]; then
            echo "::error::Tier 0 did not pass every selected shard (plan=$PLAN_RESULT, shards=$SHARD_RESULT)."
            exit 1
          fi
