name: Tier 2 Recorded Benchmark

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable candidate for strict stored-record comparison
        required: false
        type: string
      release_tag:
        description: Published stable release to compare against an earlier stable ancestor
        required: false
        type: string
  pull_request:
    branches:
      - main
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Read-only stored comparison; overrides resolve to immutable commits before checkout.
    inputs:
      base_sha:
        description: Optional reviewed base SHA; blank discovers the selected branch parent
        required: false
        type: string
      head_sha:
        description: Optional candidate SHA; blank freezes the selected branch
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tier2-recorded-benchmark-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || inputs.candidate_sha || inputs.release_tag || github.run_id }}
  cancel-in-progress: true

jobs:
  compare:
    name: Strict stored-record comparison without paid collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable event identities
        id: refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseRepo = $env:GITHUB_REPOSITORY
          $headRepo = $env:GITHUB_REPOSITORY
          if ($baseRepo -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Invalid repository identity.' }
          $baseSha = $null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          function Get-BranchApi([string]$Repository, [string]$Path) {
            $uri = "$env:GITHUB_API_URL/repos/$Repository"
            if ($Path) { $uri += "/$Path" }
            $response = Invoke-RestMethod -Uri $uri -Headers $headers
            foreach ($item in $response) { $item }
          }
          if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') {
            $pull = (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).pull_request
            $baseRepo = $pull.base.repo.full_name
            $headRepo = $pull.head.repo.full_name
            if ($baseRepo -cne $env:GITHUB_REPOSITORY -or $pull.base.ref -cne 'main') { throw 'Pull request must target main in this repository.' }
            if ($headRepo -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Invalid pull request head repository identity.' }
            $baseSha = $pull.base.sha
            $headSha = $pull.head.sha
          } elseif ($env:RELEASE_TAG -or $env:CANDIDATE_SHA) {
            function Get-ReleaseApi([string]$Path) {
              $response = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$baseRepo/$Path" -Headers $headers
              foreach ($item in $response) { $item }
            }
            function Resolve-ReleaseCommit([string]$Tag) {
              $object = (Get-ReleaseApi "git/ref/tags/$([Uri]::EscapeDataString($Tag))").object
              $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
              while ($true) {
                if ($object.sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid release object identity.' }
                if ($object.type -ceq 'commit') { return $object.sha }
                if ($object.type -cne 'tag' -or -not $seen.Add($object.sha)) { throw 'Invalid release tag chain.' }
                $object = (Get-ReleaseApi "git/tags/$($object.sha)").object
              }
            }
            if ($env:CANDIDATE_SHA) {
              if ($env:RELEASE_TAG -or $env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'One immutable candidate SHA required.' }
              $headSha = $env:CANDIDATE_SHA
              $release = @{ id = $null; published_at = [DateTimeOffset]::UtcNow }
            } else {
              $release = Get-ReleaseApi "releases/tags/$([Uri]::EscapeDataString($env:RELEASE_TAG))"
              if ($release.draft -or $release.prerelease -or -not $release.published_at) { throw 'A published stable release is required.' }
              $headSha = Resolve-ReleaseCommit $env:RELEASE_TAG
            }
            $releases = [Collections.Generic.List[object]]::new()
            $page = 1
            do {
              $batch = @(Get-ReleaseApi "releases?per_page=100&page=$page")
              foreach ($item in $batch) { $releases.Add($item) }
              $page++
            } while ($batch.Count -eq 100)
            $candidates = @($releases | Where-Object {
              -not $_.draft -and -not $_.prerelease -and $_.id -ne $release.id -and
              $_.published_at -and [DateTimeOffset]$_.published_at -le [DateTimeOffset]$release.published_at
            } | Sort-Object { [DateTimeOffset]$_.published_at } -Descending)
            foreach ($candidate in $candidates) {
              $candidateSha = Resolve-ReleaseCommit $candidate.tag_name
              $comparison = Get-ReleaseApi "compare/$candidateSha...$headSha"
              if ($comparison.status -cin @('ahead', 'identical')) { $baseSha = $candidateSha; break }
            }
          } else {
            $eventData = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $baseSha = $eventData.inputs.base_sha
            $headSha = $eventData.inputs.head_sha
            if (-not $headSha) {
              if (-not $env:SELECTED_BRANCH) { throw 'Selected branch is required for the default candidate.' }
              $headSha = (Get-BranchApi $headRepo "branches/$([Uri]::EscapeDataString($env:SELECTED_BRANCH))").commit.sha
            }
            if (-not $baseSha) {
              if (-not $env:SELECTED_BRANCH) { throw 'Selected branch is required to discover its parent.' }
              $repository = Get-BranchApi $headRepo ''
              $owner = $headRepo.Split('/')[0]
              $query = [Uri]::EscapeDataString("${owner}:$env:SELECTED_BRANCH")
              $parents = @(Get-BranchApi $headRepo "pulls?state=open&head=$query&per_page=100")
              if ($parents.Count -eq 0 -and $repository.fork) {
                $upstream = $repository.parent.full_name
                if ($upstream -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Invalid upstream repository identity.' }
                $parents = @(Get-BranchApi $upstream "pulls?state=open&head=$query&per_page=100")
              }
              if ($parents.Count -gt 1) { throw 'Multiple open PR parents; supply base_sha explicitly.' }
              if ($parents.Count -eq 1) {
                $baseRepo = $parents[0].base.repo.full_name
                $baseBranch = $parents[0].base.ref
              } else {
                $baseBranch = $repository.default_branch
                if ($baseBranch -ceq $env:SELECTED_BRANCH) { throw 'Selected branch has no distinct parent; supply base_sha explicitly.' }
              }
              if ($baseRepo -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or -not $baseBranch) { throw 'Invalid parent branch identity.' }
              $baseSha = (Get-BranchApi $baseRepo "branches/$([Uri]::EscapeDataString($baseBranch))").commit.sha
            }
          }
          if ($headSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit SHA required.' }
          if ($baseSha -and $baseSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit SHA required.' }
          "base=$baseSha", "head=$headSha", "base_repository=$baseRepo", "head_repository=$headRepo" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Checkout reviewed base implementation
        if: steps.refs.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.refs.outputs.base_repository }}
          ref: ${{ steps.refs.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Fetch candidate objects without checkout or execution
        if: steps.refs.outputs.base != ''
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          HEAD_REPOSITORY: ${{ steps.refs.outputs.head_repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:BASE_SHA) { throw 'Base checkout identity mismatch.' }
          git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules -- "https://github.com/$($env:HEAD_REPOSITORY).git" $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Candidate fetch failed.' }
          if ((git rev-parse FETCH_HEAD).Trim() -cne $env:HEAD_SHA) { throw 'Candidate fetch identity mismatch.' }

      - name: Compare or report missing baseline tooling
        id: compare
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $outputRoot = Join-Path $PWD '.benchmark-recorded-public'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          $helper = './tests/tier2/live-benchmark/Compare-BranchBenchmark.ps1'
          if ($env:BASE_SHA -and (Test-Path -LiteralPath $helper -PathType Leaf)) {
            & pwsh -NoProfile -File $helper -Repository $PWD -BaseRef $env:BASE_SHA -HeadRef $env:HEAD_SHA -OutputDirectory $outputRoot
            $code = $LASTEXITCODE
          } else {
            $reason = if ($env:BASE_SHA) { 'base-comparison-tooling-unavailable' } else { 'previous-stable-release-unavailable' }
            @{ schemaVersion = 'benchmark-report-v1'; status = 'missing-baseline'; exitCode = 2
              baseCommit = $env:BASE_SHA; headCommit = $env:HEAD_SHA; reasons = @($reason) } |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $outputRoot 'report.json')
            "# Efficiency benchmark`n`n**Missing baseline/tooling (exit 2).**`n`nReason: $reason`n`nNo candidate helper executed; no comparison or quality approval claimed." |
              Set-Content -LiteralPath (Join-Path $outputRoot 'report.md')
            '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="28" role="img" aria-label="benchmark unavailable"><rect width="220" height="28" fill="#6b7280"/><text x="10" y="18" fill="white">benchmark unavailable</text></svg>' |
              Set-Content -LiteralPath (Join-Path $outputRoot 'badge.svg')
            $code = 2
          }
          if ($code -notin @(0, 1, 2, 3)) { $code = 1 }
          $strictRoot = Join-Path $outputRoot 'strict'
          New-Item -ItemType Directory -Path $strictRoot -Force | Out-Null
          foreach ($name in @('report.json', 'report.md', 'badge.svg')) {
            Copy-Item -LiteralPath (Join-Path $outputRoot $name) -Destination (Join-Path $strictRoot $name)
          }
          "verdict=$code" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      # Report-only controller reviewed in PR42. Never select code from PR refs or data pointers.
      - name: Checkout immutable reviewed report implementation
        if: always() && steps.refs.outputs.base != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jmservera/hve-squad
          ref: 019c894bb0430802f47d2fc513fe326bec4023d2 # reviewed PR42, reporting only
          path: .benchmark-report-engine
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Render observations with reviewed report implementation
        id: report
        if: always() && steps.refs.outputs.base != ''
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          STRICT_VERDICT: ${{ steps.compare.outputs.verdict }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $repository = $PWD.Path
          $outputRoot = Join-Path $repository '.benchmark-recorded-public'
          $engine = Join-Path $repository '.benchmark-report-engine'
          $expected = '019c894bb0430802f47d2fc513fe326bec4023d2'
          $actual = & git -C $engine rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0 -or ([string]$actual).Trim() -cne $expected) { throw 'Reviewed report implementation identity mismatch; strict reports retained.' }
          if ($env:STRICT_VERDICT -cnotmatch '^[0-3]$') { throw 'Strict comparison verdict unavailable; strict reports retained.' }
          Import-Module (Join-Path $engine 'tests/tier2/live-benchmark/BenchmarkResults.psm1') -Force
          $strictPath = Join-Path $outputRoot 'strict/report.json'
          $strict = ConvertFrom-BenchmarkJson ([IO.File]::ReadAllBytes($strictPath))
          if ($strict.baseCommit -cne $env:BASE_SHA -or $strict.headCommit -cne $env:HEAD_SHA -or $strict.exitCode -ne [int]$env:STRICT_VERDICT) { throw 'Strict report identity/verdict mismatch; strict reports retained.' }
          $report = Compare-BranchBenchmark -Repository $repository -BaseRef $env:BASE_SHA -HeadRef $env:HEAD_SHA
          $report['strictComparison'] = $strict
          $report['strictVerdict'] = [int]$env:STRICT_VERDICT
          $report['reportingEngine'] = @{ repository = 'jmservera/hve-squad'; revision = $expected; scope = 'descriptive-only-no-verdict-override' }
          if ($report.headCampaign -and -not $report.availability.Contains('campaign')) {
            $campaign = $report.headCampaign
            $incomplete = $campaign.trials.Count -ne 3 -or @($campaign.trials | Where-Object { $null -eq $_.quality -or -not $_.accounting.complete }).Count -gt 0
            $report.status = 'not-evaluable'
            $report.exitCode = 2
            $report.reasons = @($(if ($incomplete) { 'incomplete-observational-campaign' } else { 'observational-campaign-not-comparable' }))
          }
          Write-BenchmarkReport -Report $report -OutputDirectory $outputRoot
          $summary = Join-Path $outputRoot 'report.md'
          $content = [IO.File]::ReadAllText($summary)
          $strictNote = "## Strict comparison (unchanged gate)`n`nThe reviewed base implementation returned **$($strict.status)**, exit **$env:STRICT_VERDICT**. Reasons: $($strict.reasons -join ', '). This report-only renderer does not change that gate. Exact original artifacts are retained under ``strict/``.`n`n"
          if ($report.headCampaign -and -not $report.availability.Contains('campaign')) {
            $campaignText = [IO.File]::ReadAllText((Join-Path $outputRoot 'campaign-report.md'))
            $content = $campaignText + "`n" + $strictNote + $content
          } else { $content = $strictNote + $content }
          [IO.File]::WriteAllText($summary, $content, [Text.UTF8Encoding]::new($false))
          "verdict=$($report.exitCode)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0

      - name: Publish report summary
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $PWD '.benchmark-recorded-public'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $report = Join-Path $root 'report.md'
          if (-not (Test-Path -LiteralPath $report)) {
            '# Efficiency benchmark: operational failure before comparison. No passing result.' | Set-Content -LiteralPath $report
            @{ schemaVersion = 'benchmark-report-v1'; status = 'operational-error'; exitCode = 1; reasons = @('workflow-preflight-failed') } |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'report.json')
          }
          Get-Content -LiteralPath $report -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload comparison and SVG
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efficiency-comparison
          path: |
            .benchmark-recorded-public/report.json
            .benchmark-recorded-public/report.md
            .benchmark-recorded-public/badge.svg
            .benchmark-recorded-public/campaign-report.json
            .benchmark-recorded-public/campaign-report.md
            .benchmark-recorded-public/campaign-badge.svg
            .benchmark-recorded-public/strict/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Propagate comparison verdict
        if: always()
        shell: pwsh
        env:
          VERDICT: ${{ steps.compare.outputs.verdict }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          REPORT_VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          if ($env:VERDICT -notmatch '^[0-3]$') { exit 1 }
          if ($env:VERDICT -eq '0') {
            if ($env:REPORT_OUTCOME -ne 'success' -or $env:REPORT_VERDICT -notmatch '^[0-3]$') { exit 1 }
            if ($env:REPORT_VERDICT -ne '0') { exit ([int]$env:REPORT_VERDICT) }
          }
          exit ([int]$env:VERDICT)
