name: Efficiency comparison

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Read-only report; operators supply reviewed immutable commits, validated before checkout.
    inputs:
      base_sha:
        description: Authorized reviewed base commit (full SHA; not a branch name)
        required: true
        type: string
      head_sha:
        description: Candidate commit in this repository (full SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: efficiency-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  compare:
    name: Branch-relative benchmark report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate immutable event identities
        id: refs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $eventData = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $baseSha = $eventData.pull_request.base.sha
            $headSha = $eventData.pull_request.head.sha
            $baseRepo = $eventData.pull_request.base.repo.full_name
            $headRepo = $eventData.pull_request.head.repo.full_name
          } else {
            $baseSha = $eventData.inputs.base_sha
            $headSha = $eventData.inputs.head_sha
            $baseRepo = $env:GITHUB_REPOSITORY
            $headRepo = $env:GITHUB_REPOSITORY
          }
          if ($baseRepo -cne $env:GITHUB_REPOSITORY) { throw 'Base repository mismatch.' }
          foreach ($oid in @($baseSha, $headSha)) {
            if ($oid -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit SHA required.' }
          }
          foreach ($repo in @($baseRepo, $headRepo)) {
            if ($repo -cnotmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'Invalid repository identity.' }
          }
          "base=$baseSha", "head=$headSha", "base_repository=$baseRepo", "head_repository=$headRepo" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Checkout reviewed base implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.refs.outputs.base_repository }}
          ref: ${{ steps.refs.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Fetch candidate objects without checkout or execution
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          HEAD_REPOSITORY: ${{ steps.refs.outputs.head_repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:BASE_SHA) { throw 'Base checkout identity mismatch.' }
          git -c core.hooksPath=/dev/null fetch --no-tags --no-recurse-submodules -- "https://github.com/$($env:HEAD_REPOSITORY).git" $env:HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Candidate fetch failed.' }
          if ((git rev-parse FETCH_HEAD).Trim() -cne $env:HEAD_SHA) { throw 'Candidate fetch identity mismatch.' }

      - name: Compare or report missing baseline tooling
        id: compare
        shell: pwsh
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'efficiency-report'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          $helper = './tests/tier2/live-benchmark/Compare-BranchBenchmark.ps1'
          if (Test-Path -LiteralPath $helper -PathType Leaf) {
            & pwsh -NoProfile -File $helper -Repository $PWD -BaseRef $env:BASE_SHA -HeadRef $env:HEAD_SHA -OutputDirectory $outputRoot
            $code = $LASTEXITCODE
          } else {
            @{
              schemaVersion = 'benchmark-report-v1'
              status = 'missing-baseline'
              exitCode = 2
              baseCommit = $env:BASE_SHA
              headCommit = $env:HEAD_SHA
              reasons = @('base-comparison-tooling-unavailable')
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $outputRoot 'report.json')
            "# Efficiency benchmark`n`n**Missing baseline/tooling (exit 2).**`n`nBase: $env:BASE_SHA`n`nHead: $env:HEAD_SHA`n`nNo candidate helper executed; no comparison or quality approval claimed." |
              Set-Content -LiteralPath (Join-Path $outputRoot 'report.md')
            '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="28" role="img" aria-label="benchmark unavailable"><rect width="220" height="28" fill="#6b7280"/><text x="10" y="18" fill="white">benchmark unavailable</text></svg>' |
              Set-Content -LiteralPath (Join-Path $outputRoot 'badge.svg')
            $code = 2
          }
          if ($code -notin @(0, 1, 2, 3)) { $code = 1 }
          "$code" | Set-Content -LiteralPath (Join-Path $outputRoot 'exit-code.txt')
          "verdict=$code" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Publish report summary
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'efficiency-report/report.md'
          if (Test-Path -LiteralPath $report) {
            Get-Content -LiteralPath $report -Raw | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            $outputRoot = Split-Path $report
            New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
            $message = '# Efficiency benchmark: operational failure before comparison. No passing result.'
            $message | Set-Content -LiteralPath $report
            $message | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            @{ schemaVersion = 'benchmark-report-v1'; status = 'operational-error'; exitCode = 1; reasons = @('workflow-preflight-failed') } |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $outputRoot 'report.json')
            '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="28" role="img" aria-label="benchmark unavailable"><rect width="220" height="28" fill="#6b7280"/><text x="10" y="18" fill="white">benchmark unavailable</text></svg>' |
              Set-Content -LiteralPath (Join-Path $outputRoot 'badge.svg')
          }

      - name: Upload comparison and SVG
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efficiency-comparison
          path: ${{ runner.temp }}/efficiency-report/
          if-no-files-found: error
          retention-days: 30

      - name: Propagate comparison verdict
        if: always()
        shell: pwsh
        env:
          VERDICT: ${{ steps.compare.outputs.verdict }}
        run: |
          if ($env:VERDICT -notmatch '^[0-3]$') { exit 1 }
          exit ([int]$env:VERDICT)
