name: Sync Model Catalog, Rates, and Benchmarks

# Runs every morning at 06:30 UTC or on demand.
#
# What it does:
#   1. Runs scripts/Sync-ModelCatalog.ps1 against official GitHub Copilot docs
#      (Supported AI models, Models and pricing, AI model comparison, and
#      Copilot Fusion) to add newly released models, update token pricing,
#      maintain Copilot Fusion effort levels (`fusion-standard`, `hydrafusion`,
#      `hydrafusion-max`), and prune retired models from `model-catalog.md` and
#      `consumption-rates-template.md` with synchronized dates.
#   2. Runs scripts/Sync-ModelBenchmarks.ps1 to download the daily Epoch AI
#      Benchmarking Hub dataset (CC BY 4.0) — and optionally enrich from the
#      Artificial Analysis Free Data API when ARTIFICIAL_ANALYSIS_API_KEY is
#      configured — extracting task-specific benchmark evaluations for the
#      active models declared in model-catalog.md.
#   3. Verifies supported exact-model results against original publisher
#      records and methodology, separately from result and generation dates.
#      When neither catalog/rates nor benchmark evidence changed (and snapshots
#      remain younger than the 60-day renewal window before 90-day expiration),
#      the run exits cleanly without opening a noisy pull request.
#   4. When models, rates, or benchmark scores change (or the 60-day refresh
#      window is reached, or force=true), validates hot-file budgets and the
#      routing/provenance contract (`HotFileBudget.Tests.ps1` and
#      `ModelRouting.Tests.ps1`) before proposing any change.
#   5. Records a patch change fragment under .changes/unreleased/, pushes the
#      branch `chore/sync-model-benchmarks`, and opens or updates a reviewed
#      pull request against `main` (satisfying the reviewed-snapshot contract
#      in issue #166).
#
# Runtime squad dispatches NEVER fetch catalog or benchmark data from the web;
# they read the committed reference files offline.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual dispatch (write access required); dry_run is a typed boolean that gates publication directly.
    inputs:
      force:
        description: 'Force snapshot refresh even if models, rates, and benchmark scores are unchanged'
        type: boolean
        default: false
      allow_coverage_reduction:
        description: 'Accept intentional loss of existing independent model/evaluation coverage'
        type: boolean
        default: false
      dry_run:
        description: 'Compute and validate the snapshots without pushing a branch or opening a PR'
        type: boolean
        default: false

concurrency:
  group: sync-model-benchmarks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-benchmarks:
    name: Refresh model catalog, rates, and benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync model catalog and consumption rates
        id: catalog
        shell: pwsh
        env:
          FORCE: ${{ inputs.force }}
        run: |
          $params = @{
            GitHubOutput = $true
          }
          if ($env:FORCE -eq 'true') {
            $params['Force'] = $true
          }
          $catResult = ./scripts/Sync-ModelCatalog.ps1 @params
          @(
            '### Model Catalog & Rates Sync'
            ''
            '| Field | Value |'
            '| --- | --- |'
            "| Updated | ``$($catResult.Updated)`` |"
            "| Retrieved / Observed-on | ``$($catResult.Retrieved)`` |"
            "| Active models | **$($catResult.ModelsCount)** |"
            "| Added models | ``$(if ($catResult.AddedModels.Count) { $catResult.AddedModels -join ', ' } else { 'none' })`` |"
            "| Retired models | ``$(if ($catResult.RetiredModels.Count) { $catResult.RetiredModels -join ', ' } else { 'none' })`` |"
            "| Rates template bytes | ``$($catResult.RatesTemplateBytes)`` |"
            "| Semantic digest | ``$($catResult.Digest)`` |"
            ''
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Sync benchmark knowledge base
        id: sync
        shell: pwsh
        env:
          FORCE: ${{ inputs.force }}
          ALLOW_COVERAGE_REDUCTION: ${{ inputs.allow_coverage_reduction }}
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: |
          $params = @{
            GitHubOutput = $true
          }
          if ($env:FORCE -eq 'true') {
            $params['Force'] = $true
          }
          if ($env:ALLOW_COVERAGE_REDUCTION -eq 'true') {
            $params['AllowCoverageReduction'] = $true
          }
          $result = ./scripts/Sync-ModelBenchmarks.ps1 @params
          @(
            '### Model Benchmarks Sync'
            ''
            "| Field | Value |"
            "| --- | --- |"
            "| Updated | ``$($result.Updated)`` |"
            "| Retrieved | ``$($result.Retrieved)`` |"
            "| Generated | ``$($result.Generated)`` |"
            "| Models covered | **$($result.ModelsCovered)** |"
            "| Models with verified evidence | **$($result.VerifiedModelsCovered)** |"
            "| Score rows | **$($result.ScoresCount)** |"
            "| Content digest | ``$($result.Digest)`` |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Install Pester
        if: steps.catalog.outputs.updated == 'true' || steps.sync.outputs.updated == 'true'
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Validate hot-file budget, catalog, rates, and routing contract
        if: steps.catalog.outputs.updated == 'true' || steps.sync.outputs.updated == 'true'
        shell: pwsh
        run: |
          $repoRoot = (Resolve-Path -LiteralPath '.').Path
          $tier0Config = New-PesterConfiguration
          $tier0Config.Run.Container = @(
            New-PesterContainer -Path './tests/tier0/HotFileBudget.Tests.ps1' -Data @{ SourceRoot = $repoRoot }
            New-PesterContainer -Path './tests/tier0/Performance.Tests.ps1' -Data @{ SourceRoot = $repoRoot }
          )
          $tier0Config.Run.PassThru = $true
          $tier0Config.Output.Verbosity = 'Normal'
          $tier0Res = Invoke-Pester -Configuration $tier0Config
          if ($tier0Res.FailedCount -gt 0 -or $tier0Res.Result -ne 'Passed') {
            throw "Tier 0 budget/contract checks failed ($($tier0Res.FailedCount) failure(s)); refusing to propose an invalid catalog or rates template."
          }

          $config = New-PesterConfiguration
          $config.Run.Path = './tests/tier1/ModelRouting.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Normal'
          $res = Invoke-Pester -Configuration $config
          if ($res.FailedCount -gt 0 -or $res.Result -ne 'Passed') {
            throw "ModelRouting.Tests.ps1 failed ($($res.FailedCount) failure(s)); refusing to propose an invalid catalog or benchmark snapshot."
          }

      - name: Verify shared scoring and offline snapshot reproducibility
        if: steps.catalog.outputs.updated == 'true' || steps.sync.outputs.updated == 'true'
        shell: pwsh
        run: |
          $path = './squad-src/.github/skills/squad/references/model-benchmarks.md'
          $result = ./scripts/Sync-ModelBenchmarks.ps1 -SnapshotPath $path -OutputPath $path -DryRun
          if ($result.Updated -or $result.ScoringPolicy -ne 'squad-capability-v3') {
            throw 'Shared scoring views or policy identity differ from the generated snapshot; refusing publication.'
          }

      - name: Propose reviewed pull request
        if: (steps.catalog.outputs.updated == 'true' || steps.sync.outputs.updated == 'true') && !inputs.dry_run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SYNC_DEPS_TOKEN || secrets.GITHUB_TOKEN }}
          CAT_RETRIEVED: ${{ steps.catalog.outputs.retrieved }}
          CAT_MODELS: ${{ steps.catalog.outputs.models_count }}
          CAT_ADDED: ${{ steps.catalog.outputs.added_models }}
          CAT_RETIRED: ${{ steps.catalog.outputs.retired_models }}
          RETRIEVED: ${{ steps.sync.outputs.retrieved }}
          DIGEST: ${{ steps.sync.outputs.digest }}
          MODELS_COVERED: ${{ steps.sync.outputs.models_covered }}
          SCORES_COUNT: ${{ steps.sync.outputs.scores_count }}
          REPO: ${{ github.repository }}
        run: |
          $branch = 'chore/sync-model-benchmarks'
          $stamp = if ($env:CAT_RETRIEVED) { $env:CAT_RETRIEVED } else { $env:RETRIEVED }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:REPO).git"
          git checkout -B $branch

          $fragmentLines = @(
            "- Refreshed ``model-catalog.md``, ``consumption-rates-template.md``, and ``model-benchmarks.md`` ($($env:CAT_MODELS) catalog models; $($env:SCORES_COUNT) score rows across $($env:MODELS_COVERED) benchmarked models; digest ``$($env:DIGEST)``)."
          )
          if ($env:CAT_ADDED) { $fragmentLines += "- Added newly supported Copilot models: ``$($env:CAT_ADDED)``." }
          if ($env:CAT_RETIRED) { $fragmentLines += "- Pruned retired Copilot models from active routing and benchmark checks: ``$($env:CAT_RETIRED)``." }
          ./scripts/New-ChangeFragment.ps1 -Type Changed -Bump patch -Force `
            -Title "sync model catalog and benchmarks $stamp" `
            -Body ($fragmentLines -join "`n")

          git add `
            squad-src/.github/skills/squad/references/model-catalog.md `
            squad-src/.github/skills/squad/references/consumption-rates-template.md `
            squad-src/.github/skills/squad/references/model-benchmarks.md `
            .changes/unreleased
          if ((git status --porcelain).Count -eq 0) {
            Write-Host '::notice::No working tree changes to commit.'
            return
          }

          git commit -m "chore(models): sync model catalog, rates, and benchmarks ($stamp)"
          git push --force origin "refs/heads/$branch"

          $prTitle = "chore(models): sync model catalog, rates, and benchmarks ($stamp)"
          $prBody = @(
            '## Summary'
            ''
            'Automated refresh of `model-catalog.md`, `consumption-rates-template.md`, and `model-benchmarks.md` from official GitHub Copilot documentation and independent upstream benchmark sources (`epoch-ai`, `artificial-analysis`).'
            ''
            "- **Catalog / rates date**: ``$($env:CAT_RETRIEVED)`` ($($env:CAT_MODELS) active models)"
            "- **Added models**: ``$(if ($env:CAT_ADDED) { $env:CAT_ADDED } else { 'none' })``"
            "- **Retired models pruned**: ``$(if ($env:CAT_RETIRED) { $env:CAT_RETIRED } else { 'none' })``"
            "- **Benchmark evidence retrieved**: ``$($env:RETRIEVED)``"
            "- **Benchmark content digest**: ``$($env:DIGEST)``"
            "- **Independently evaluated catalog models**: $($env:MODELS_COVERED)"
            "- **Total benchmark score rows**: $($env:SCORES_COUNT)"
            ''
            '## Validation'
            ''
            '- `Invoke-Pester` (`HotFileBudget.Tests.ps1` + `ModelRouting.Tests.ps1`): **passed**'
          ) -join "`n"

          $existingPr = gh pr list --repo $env:REPO --head $branch --state open --json number --jq '.[0].number'
          if ($existingPr) {
            gh pr edit $existingPr --repo $env:REPO --title $prTitle --body $prBody
            Write-Host "::notice::Updated open model sync PR #$existingPr."
          }
          else {
            $url = gh pr create --repo $env:REPO --base main --head $branch --title $prTitle --body $prBody
            Write-Host "::notice::Opened model sync PR: $url"
          }
